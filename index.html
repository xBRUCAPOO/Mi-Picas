<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- Color de la barra del navegador en celulares: script.js le pone el valor de --color-fondo -->
    <meta name="theme-color" id="color-tema" content="">
    <title>Hola</title>

    <!-- Tipografías de Google Fonts (las 3 que usa esta página, cada una es una variable en el :root) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Playwrite+ID:wght@100..400&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <!-- Íconos de Google Fonts (Material Symbols): solo se descargan los íconos usados -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,200,0,0&icon_names=arrow_forward&display=block" rel="stylesheet">

    <link rel="stylesheet" href="style.css?v=1">
</head>

<body>
    <!-- ===== FONDO: NOCHE ESTRELLADA ===== -->
    <div class="fondo-noche" aria-hidden="true">
        <div class="nebulosa nebulosa-1"></div>
        <div class="nebulosa nebulosa-2"></div>
        <div class="via-lactea"></div>
        <canvas id="cielo" class="cielo"></canvas>
        <div class="luna"></div>
    </div>

    <!-- ===== PANTALLA DE CONTRASEÑAS ===== -->
    <main class="acceso">
        <section class="caja" id="caja">
            <h1 class="titulo">Hola</h1>
            <p class="subtitulo">Ingresá las 10 contraseñas para continuar</p>

            <!-- Los 10 campos se generan desde script.js (lista CLAVES) -->
            <div class="claves" id="claves"></div>

            <p class="anuncio" id="anuncio" aria-live="polite"></p>

            <button class="boton" id="boton" type="button">
                Continuar
                <span class="material-symbols-rounded" aria-hidden="true">arrow_forward</span>
            </button>
        </section>

        <footer class="pie">
            <span>v1.0</span>
            <span aria-hidden="true">·</span>
            <time datetime="2026-11-08">08/11/2026</time>
        </footer>
    </main>

    <!-- ===== ESCENA: candado con forma de corazón y llave con forma de as de picas ===== -->
    <section class="escena" id="escena" aria-hidden="true">
        <div class="escena-caja" id="escena-caja">
            <div class="candado" id="candado">
                <svg class="candado-svg" viewBox="0 0 200 220">
                    <!-- Arco (grillete): se levanta para abrir el candado -->
                    <path class="arco" d="M60 72 V48 A40 40 0 0 1 140 48 V72"></path>
                    <!-- Cuerpo en forma de corazón -->
                    <path class="corazon" d="M100 205 C40 160 8 122 8 80 C8 42 36 14 70 14 C86 14 98 24 100 38 C102 24 114 14 130 14 C164 14 192 42 192 80 C192 122 160 160 100 205 Z"></path>
                    <!-- Ojo de la cerradura -->
                    <circle class="ojo" cx="100" cy="98" r="11"></circle>
                    <rect class="ojo" x="94" y="104" width="12" height="30" rx="4"></rect>
                </svg>
            </div>

            <!-- Llave con forma de as de picas: entra, gira y abre el candado -->
            <svg class="llave" id="llave" viewBox="0 0 80 150" aria-hidden="true">
                <path class="llave-pala" d="M40 2 C34 18 2 40 2 60 C2 76 16 84 30 78 C34 76 36 74 36 74 L30 92 H50 L44 74 C44 74 46 76 50 78 C64 84 78 76 78 60 C78 40 46 18 40 2 Z"></path>
                <text class="llave-as" x="40" y="58" text-anchor="middle">A</text>
                <rect class="llave-vastago" x="36" y="90" width="8" height="54"></rect>
                <rect class="llave-diente" x="44" y="110" width="14" height="8"></rect>
                <rect class="llave-diente" x="44" y="126" width="10" height="8"></rect>
            </svg>
        </div>
    </section>

    <!-- ===== PREMIO: la imagen que aparece al desbloquear ===== -->
    <section class="premio" id="premio" aria-live="polite">
        <figure class="premio-marco">
            <!-- Reemplazá "imagen.jpg" por la imagen real (misma carpeta que index.html) -->
            <img class="premio-imagen" id="imagen-premio" src="imagen.jpg" alt="Imagen desbloqueada">
        </figure>
    </section>

    <script src="script.js?v=1"></script>
</body>

</html>
